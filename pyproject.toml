[project]
name = "nexus-shell"
version = "1.2.1"
description = "Nexus Shell AI Agent"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Andrii Bogdanovych", email = "a@bogdanovych.org" }
]
license = "EUPL-1.2"
keywords = [
    "python", "telegram", "artificial intelligence", "digital-transformation",
    "open-source", "eupl-license", "automation", "ukraine"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: Ukrainian",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiogram==3.28.2",
    "aiogram-i18n==1.5",
    "anthropic==0.105.2",
    "cryptography==48.0.0",
    "firebase-admin==7.4.0",
    "fluent-runtime==0.4.0",
    "google-genai==2.8.0",
    "openai==2.41.0",
    "pydantic-settings==2.14.1",
    "pydantic==2.13.4",
    "redis==8.0.0",
    "sqlalchemy==2.0.50",
    "asyncpg==0.31.0",
    "pymongo==4.17.0",
]

[dependency-groups]
dev = [
    "pre_commit",
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[project.urls]
"Homepage" = "https://www.bogdanovych.org"
"Repository" = "https://github.com/BogdanovychA/nexus-shell"
"DOI" = "https://doi.org/10.5281/zenodo.19817221"
"Bug Tracker" = "https://github.com/BogdanovychA/nexus-shell/issues"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
